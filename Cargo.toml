[package]
name = "ferrum-kv"
version = "0.6.0"
edition = "2024"

[dependencies]
signal-hook = "0.4.4"
# Used only to raise the TCP listen backlog: `std::net::TcpListener` hardcodes
# 128, which drops connections when hundreds of clients connect at once.
libc = "0.2"
log = "0.4"
env_logger = "0.11"
indexmap = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "signal", "sync", "time"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "engine_bench"
harness = false

[[bench]]
name = "resp2_bench"
harness = false
